services:
  mcp:
    build:
      context: .
      target: dev
    profiles: [mcp]
    environment:
      ANGEL_CREDENTIALS_FILE: /run/angel.json
      ANGEL_LOCAL_IP: ${ANGEL_LOCAL_IP:-127.0.0.1}
      ANGEL_PUBLIC_IP: ${ANGEL_PUBLIC_IP:-127.0.0.1}
    volumes:
      - ./src:/app/src:ro
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
